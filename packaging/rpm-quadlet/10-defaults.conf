# /usr/share/containers/systemd/tokensmith.container.d/10-defaults.conf
#
# =============================================================================
# TokenSmith - Default Quadlet Drop-In
# =============================================================================
#
# Package-supplied defaults for the tokensmith container.  Do not edit this
# file; it is replaced on upgrade.  Override any key by dropping a
# higher-numbered file (e.g. 20-site.conf) into
# /etc/containers/systemd/postgres.container.d/, either by hand or via one of
# the OpenCHAMI deployment meta-configuration packages.
#
# Each option lists the equivalent tokensmith command line flag, where one
# exists.  Flags are passed through Exec= in the base unit; the environment
# variables below are the supported way to set them from a drop-in.


[Container]

# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------

# The default image path for postgres for this installation. This is
# here instead of in the container file in case it moves and needs to
# be overridden. Unlike OpenCHAMI components, postgres comes from a
# non-openchami managed registry and has its own versioning scheme, so
# the version of this package cannot be used to select the image.
Image=docker.io/library/postgres:11.5-alpine

# -------------------------------------------------------------------------
# Volumes
# -------------------------------------------------------------------------

# Persistent state: database content for clients
Volume=postgres-data.volume:/var/lib/postgresql/data
Volume=/etc/openchami/pg-init:/docker-entrypoint-initdb.d

# -------------------------------------------------------------------------
# Networks
# -------------------------------------------------------------------------
# Assumes a single-node deployment of the OpenCHAMI core services alongside
# TokenSmith.  The internal network carries service traffic to the issuer and
# JWKS endpoints; the JWT network reaches the upstream OIDC provider.

Network=openchami-internal.network
Network=openchami-jwt-internal.network

# All traffic is host-local; keep the host's proxy settings out of the way.
HttpProxy=false

# Needed only when a peer is addressed by a name the container network cannot
# resolve.  Set it in a site drop-in, not here.
# AddHost=demo.openchami.cluster:172.16.0.254

Environment="POSTGRES_USER=ochami"
